<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BTC Neon Mobile Optimized</title>
<style>
  :root {
    --neon: #b026ff;
    --neon-rgb: 176, 38, 255;
    --bg-color: #060008;
    --price-size: 14vw;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-color);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #f0e6ff;
    user-select: none;
    touch-action: none;
    transition: background 0.4s ease;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 50%, rgba(var(--neon-rgb), 0.22), transparent 70%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.4s ease;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    touch-action: none;
  }

  .center-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    text-align: center;
    width: 100%;
    padding: 0 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #price {
    font-size: clamp(32px, var(--price-size), 180px);
    font-weight: 900;
    letter-spacing: -2px;
    color: rgba(255, 255, 255, 0.18);
    text-shadow: 0 0 40px rgba(var(--neon-rgb), 0.35);
    line-height: 1;
    transition: text-shadow 0.4s ease, opacity 0.3s ease;
  }

  /* Pulsante Impostazioni con Notch Safe Area */
  .settings-btn {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    z-index: 10;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .settings-btn:active {
    scale: 0.92;
    background: rgba(var(--neon-rgb), 0.3);
  }

  .settings-btn svg {
    width: 22px;
    height: 22px;
    fill: #f0e6ff;
  }

  /* Pannello Opzioni Adattivo per Mobile */
  .settings-panel {
    position: absolute;
    top: calc(72px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    z-index: 10;
    width: calc(100vw - 32px);
    max-width: 300px;
    padding: 20px;
    background: rgba(12, 6, 20, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .settings-panel.active {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0) scale(1);
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: -4px;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .preset-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
  }

  .preset-dot:active { transform: scale(1.1); }
  .preset-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 12px currentColor;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.88);
  }

  .setting-row.column {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  /* Custom Switch Touch-Optimized */
  .switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 26px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider-toggle {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255, 255, 255, 0.18);
    transition: .3s;
    border-radius: 26px;
  }

  .slider-toggle:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }

  input:checked + .slider-toggle {
    background-color: var(--neon);
  }

  input:checked + .slider-toggle:before {
    transform: translateX(22px);
  }

  /* Slider Touch */
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.2);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--neon);
    cursor: pointer;
    box-shadow: 0 0 10px var(--neon);
  }

  input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    background: none;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="bg-glow" id="bgGlow"></div>
<canvas id="chart"></canvas>

<div class="center-display">
  <div id="price">--</div>
</div>

<div class="settings-btn" id="settingsToggle" title="Impostazioni">
  <svg viewBox="0 0 24 24">
    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
  </svg>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="panel-title">Elementi Visibili</div>
  <div class="setting-row">
    <span>Mostra Grafico</span>
    <label class="switch">
      <input type="checkbox" id="toggleChart" checked>
      <span class="slider-toggle"></span>
    </label>
  </div>
  <div class="setting-row">
    <span>Mostra Prezzo</span>
    <label class="switch">
      <input type="checkbox" id="togglePrice" checked>
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="panel-title" style="margin-top: 4px;">Dimensione Prezzo</div>
  <div class="setting-row column">
    <input type="range" id="priceSizeInput" min="6" max="28" value="14" step="0.5">
  </div>

  <div class="panel-title" style="margin-top: 4px;">Colore Neon</div>
  <div class="preset-grid">
    <div class="preset-dot active" style="background: #b026ff;" data-color="#b026ff"></div>
    <div class="preset-dot" style="background: #00f3ff;" data-color="#00f3ff"></div>
    <div class="preset-dot" style="background: #39ff9d;" data-color="#39ff9d"></div>
    <div class="preset-dot" style="background: #ff007f;" data-color="#ff007f"></div>
    <div class="preset-dot" style="background: #ffaa00;" data-color="#ffaa00"></div>
  </div>

  <div class="setting-row">
    <span>Personalizzato</span>
    <input type="color" id="customColor" value="#b026ff">
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const priceEl = document.getElementById('price');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const customColorInput = document.getElementById('customColor');
  const presetDots = document.querySelectorAll('.preset-dot');

  const toggleChartInput = document.getElementById('toggleChart');
  const togglePriceInput = document.getElementById('togglePrice');
  const priceSizeInput = document.getElementById('priceSizeInput');

  let allPoints = [];
  let visibleCount = 180;
  let currentNeonHex = '#b026ff';
  let showChart = true;

  // Variabili per Gesture Touch (Pinch-to-Zoom)
  let initialTouchDist = 0;
  let initialVisibleCount = visibleCount;

  function hexToRgb(hex) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function applyTheme(hex) {
    currentNeonHex = hex;
    const rgb = hexToRgb(hex);
    document.documentElement.style.setProperty('--neon', hex);
    document.documentElement.style.setProperty('--neon-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
    customColorInput.value = hex;
    draw();
  }

  settingsToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle('active');
  });

  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && !settingsToggle.contains(e.target)) {
      settingsPanel.classList.remove('active');
    }
  });

  toggleChartInput.addEventListener('change', (e) => {
    showChart = e.target.checked;
    draw();
  });

  togglePriceInput.addEventListener('change', (e) => {
    priceEl.style.display = e.target.checked ? 'block' : 'none';
  });

  priceSizeInput.addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--price-size', `${e.target.value}vw`);
  });

  presetDots.forEach(dot => {
    dot.addEventListener('click', () => {
      presetDots.forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      applyTheme(dot.dataset.color);
    });
  });

  customColorInput.addEventListener('input', (e) => {
    presetDots.forEach(d => d.classList.remove('active'));
    applyTheme(e.target.value);
  });

  function resizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function formatPrice(p) {
    return '$' + Math.round(p).toLocaleString('en-US');
  }

  async function fetchData() {
    try {
      const r1 = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000');
      if (!r1.ok) throw new Error('Err1');
      const d1 = await r1.json();
      const t1 = d1[0][0];

      const r2 = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${t1 - 1}`);
      let d2 = [];
      if (r2.ok) d2 = await r2.json();

      let d3 = [];
      if (d2.length > 0) {
        const t2 = d2[0][0];
        const r3 = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${t2 - 1}`);
        if (r3.ok) d3 = await r3.json();
      }

      const combined = [...d3, ...d2, ...d1];
      allPoints = combined.map(k => parseFloat(k[4])).filter(p => !isNaN(p) && p > 0);

      updateView();
    } catch (e) {
      console.error('Errore dati Binance:', e);
      setTimeout(fetchData, 5000);
    }
  }

  // Zoom da Desktop (Rotella Mouse)
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (allPoints.length === 0) return;

    const zoomFactor = 1.12;
    if (e.deltaY > 0) {
      visibleCount = Math.min(allPoints.length, Math.ceil(visibleCount * zoomFactor));
    } else {
      visibleCount = Math.max(10, Math.floor(visibleCount / zoomFactor));
    }
    updateView();
  }, { passive: false });

  // Gestione Pinch-to-Zoom da Smartphone (DUE DITA)
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialVisibleCount = visibleCount;
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialTouchDist > 0) {
      e.preventDefault();
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const zoomRatio = initialTouchDist / currentDist;
      visibleCount = Math.max(10, Math.min(allPoints.length, Math.round(initialVisibleCount * zoomRatio)));
      updateView();
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      initialTouchDist = 0;
    }
  });

  function updateView() {
    if (!allPoints || allPoints.length === 0) return;
    const visible = allPoints.slice(-visibleCount);
    priceEl.textContent = formatPrice(visible[visible.length - 1]);
    draw();
  }

  function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    if (!showChart || !allPoints || allPoints.length === 0) return;

    const visible = allPoints.slice(-visibleCount);
    const paddingY = h * 0.16;

    const min = Math.min(...visible);
    const max = Math.max(...visible);
    const range = (max - min) || 1;
    const stepX = w / (visible.length - 1);

    const coordPoints = visible.map((p, i) => {
      const x = i * stepX;
      const y = h - paddingY - ((p - min) / range) * (h - paddingY * 2);
      return [x, y];
    });

    if (coordPoints.length < 2) return;

    const rgb = hexToRgb(currentNeonHex);

    const gradFill = ctx.createLinearGradient(0, 0, 0, h);
    gradFill.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.35)`);
    gradFill.addColorStop(0.7, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.05)`);
    gradFill.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);

    ctx.beginPath();
    ctx.moveTo(coordPoints[0][0], coordPoints[0][1]);
    for (let i = 1; i < coordPoints.length; i++) {
      const [x, y] = coordPoints[i];
      const [px, py] = coordPoints[i - 1];
      const midX = (px + x) / 2;
      ctx.bezierCurveTo(midX, py, midX, y, x, y);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = gradFill;
    ctx.fill();

    const glowPasses = [
      { blur: 30, alpha: 0.35, width: 8 },
      { blur: 15, alpha: 0.55, width: 4 },
      { blur: 0,  alpha: 1,    width: 2.2 }
    ];

    glowPasses.forEach(pass => {
      ctx.save();
      ctx.shadowColor = currentNeonHex;
      ctx.shadowBlur = pass.blur;
      ctx.globalAlpha = pass.alpha;
      ctx.strokeStyle = pass.blur === 0 ? '#ffffff' : currentNeonHex;
      ctx.lineWidth = pass.width;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(coordPoints[0][0], coordPoints[0][1]);
      for (let i = 1; i < coordPoints.length; i++) {
        const [x, y] = coordPoints[i];
        const [px, py] = coordPoints[i - 1];
        const midX = (px + x) / 2;
        ctx.bezierCurveTo(midX, py, midX, y, x, y);
      }
      ctx.stroke();
      ctx.restore();
    });

    const last = coordPoints[coordPoints.length - 1];
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(last[0], last[1], 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
  }

  resizeCanvas();
  fetchData();
  setInterval(fetchData, 60000);
</script>

</body>
</html>
