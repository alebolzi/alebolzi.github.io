<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡️</text></svg>">
<title>BTC Neon Mobile & Desktop</title>
<style>
  :root {
    --neon: #b026ff;
    --neon-rgb: 176, 38, 255;
    --bg-color: #060008;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-color);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #f0e6ff;
    user-select: none;
    touch-action: none;
    transition: background 0.4s ease;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 50%, rgba(var(--neon-rgb), 0.22), transparent 70%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.4s ease;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    touch-action: none;
  }

  .center-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    text-align: center;
    width: 100vw;
    padding: 30px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible;
    perspective: 1000px;
  }

  #price {
    font-weight: 900;
    letter-spacing: -2px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 0 45px rgba(var(--neon-rgb), 0.75), 0 0 15px rgba(var(--neon-rgb), 0.4);
    line-height: 1.15;
    white-space: nowrap;
    max-width: 96vw;
    display: inline-block;
    padding: 10px 20px;
    will-change: transform, filter, opacity;

    opacity: 0;
    transform: scale(0.6) translateZ(-180px);
    filter: blur(25px);
    transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                filter 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                text-shadow 0.4s ease;
  }

  #price.show-price {
    opacity: 1;
    transform: scale(1) translateZ(0);
    filter: blur(0);
  }

  .settings-btn {
    position: absolute;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: calc(20px + env(safe-area-inset-right, 0px));
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.08;
    transform: scale(0.95);
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
  }

  .settings-btn.near,
  .settings-btn.active-panel {
    opacity: 1;
    transform: scale(1);
  }

  .settings-btn:hover {
    background: rgba(var(--neon-rgb), 0.2);
    border-color: var(--neon);
    box-shadow: 0 0 15px rgba(var(--neon-rgb), 0.4);
  }

  .settings-btn svg {
    width: 20px;
    height: 20px;
    stroke: #f0e6ff;
    stroke-width: 1.5;
    fill: none;
    transition: transform 0.5s ease;
  }

  .settings-btn:hover svg {
    transform: rotate(60deg);
  }

  .settings-panel {
    position: absolute;
    top: calc(72px + env(safe-area-inset-top, 0px));
    right: calc(20px + env(safe-area-inset-right, 0px));
    z-index: 10;
    width: 230px;
    padding: 18px;
    background: rgba(12, 6, 20, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .settings-panel.active {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0) scale(1);
  }

  .toggle-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .icon-toggle {
    height: 42px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.35;
    transition: all 0.3s ease;
  }

  .icon-toggle svg {
    width: 22px;
    height: 22px;
    stroke: #ffffff;
    stroke-width: 1.8;
    fill: none;
    transition: all 0.3s ease;
  }

  .icon-toggle.active {
    opacity: 1;
    background: rgba(var(--neon-rgb), 0.2);
    border-color: var(--neon);
    box-shadow: 0 0 16px rgba(var(--neon-rgb), 0.5);
  }

  .icon-toggle.active svg {
    stroke: #ffffff;
    filter: drop-shadow(0 0 6px var(--neon));
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .slider-icon {
    width: 18px;
    height: 18px;
    stroke: rgba(255, 255, 255, 0.5);
    stroke-width: 1.8;
    fill: none;
    flex-shrink: 0;
  }

  input[type="range"] {
    -webkit-appearance: none;
    flex-grow: 1;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.18);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--neon);
    cursor: pointer;
    box-shadow: 0 0 10px var(--neon);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    align-items: center;
  }

  .preset-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    outline: none;
    transition: transform 0.2s, border-color 0.2s, filter 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .preset-dot:active { transform: scale(1.1); }
  
  .preset-dot.active {
    border-color: #ffffff;
    filter: drop-shadow(0 0 6px currentColor);
  }

  .preset-dot.palette-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #ffffff;
    overflow: hidden;
  }

  .preset-dot.palette-btn.active {
    border-color: var(--neon);
    background: rgba(var(--neon-rgb), 0.25);
    filter: drop-shadow(0 0 8px var(--neon));
  }

  .preset-dot.palette-btn svg {
    width: 18px;
    height: 18px;
    stroke: rgba(255, 255, 255, 0.85);
    stroke-width: 1.8;
    fill: none;
    pointer-events: none;
    transition: stroke 0.3s ease;
  }

  .preset-dot.palette-btn.active svg {
    stroke: #ffffff;
  }

  .preset-dot.palette-btn input[type="color"] {
    position: absolute;
    top: -5px;
    left: -5px;
    width: 42px;
    height: 42px;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
    margin: 0;
  }
</style>
</head>
<body>

<div class="bg-glow" id="bgGlow"></div>
<canvas id="chart"></canvas>

<div class="center-display">
  <div id="price">--</div>
</div>

<div class="settings-btn" id="settingsToggle" title="Impostazioni">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="toggle-grid">
    <div class="icon-toggle active" id="btnChart" title="Grafico">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"></path>
        <path d="M18 9l-5 5-4-4-3 3"></path>
      </svg>
    </div>
    <div class="icon-toggle active" id="btnPrice" title="Prezzo">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    </div>
  </div>

  <div class="slider-row">
    <svg class="slider-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
    </svg>
    <input type="range" id="animDurationInput" min="0.1" max="5.0" step="0.1">
    <svg class="slider-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 11 17 C 7.7 17 5 14.3 5 11 C 5 7.7 7.7 5 11 5 C 14.3 5 17 7.7 17 11 C 17 13.5 15 15.5 12.5 15.5 C 10 15.5 8.5 14 8.5 12 C 8.5 10 10 8.5 11.5 8.5"></path>
      <path d="M 2 19 C 2 19 14 19 17 19 C 20 19 22 17.5 22 15 C 22 12.5 20 11 18 11"></path>
      <path d="M 18 11 L 16.5 6.5"></path>
      <path d="M 20 12 L 22.5 8"></path>
    </svg>
  </div>

  <div class="slider-row">
    <svg class="slider-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="range" id="priceSizeInput" min="1" max="100" step="1">
    <svg class="slider-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 7 4 4 20 4 20 7"></polyline>
      <line x1="12" y1="4" x2="12" y2="20"></line>
      <line x1="9" y1="20" x2="15" y2="20"></line>
    </svg>
  </div>

  <div class="preset-grid">
    <div class="preset-dot" style="background: #b026ff;" data-color="#b026ff"></div>
    <div class="preset-dot" style="background: #00f3ff;" data-color="#00f3ff"></div>
    <div class="preset-dot" style="background: #39ff9d;" data-color="#39ff9d"></div>
    <div class="preset-dot" style="background: #ff007f;" data-color="#ff007f"></div>
    
    <div class="preset-dot palette-btn" id="paletteBtn" title="Colore Personalizzato">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21a9 9 0 1 1 0-18c4.97 0 9 3.58 9 8 0 2.21-1.79 4-4 4h-2.5a1.5 1.5 0 0 0-1.5 1.5c0 .41.16.79.44 1.06.27.27.44.65.44 1.06 0 1.33-1.12 2.38-2.88 2.38z"></path>
        <circle cx="7.5" cy="10.5" r=".75" fill="currentColor"></circle>
        <circle cx="12" cy="7.5" r=".75" fill="currentColor"></circle>
        <circle cx="16.5" cy="10.5" r=".75" fill="currentColor"></circle>
      </svg>
      <input type="color" id="customColor">
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const priceEl = document.getElementById('price');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const customColorInput = document.getElementById('customColor');
  const presetDots = document.querySelectorAll('.preset-dot:not(.palette-btn)');
  const paletteBtn = document.getElementById('paletteBtn');

  const btnChart = document.getElementById('btnChart');
  const btnPrice = document.getElementById('btnPrice');
  const priceSizeInput = document.getElementById('priceSizeInput');
  const animDurationInput = document.getElementById('animDurationInput');

  const DEFAULT_SETTINGS = {
    showChart: true,
    showPrice: true,
    priceSize: 60,
    animDuration: 2.6,
    neonColor: '#b026ff'
  };

  let allPoints = [];
  let visibleCount = 180;
  let currentNeonHex = DEFAULT_SETTINGS.neonColor;
  let showChart = DEFAULT_SETTINGS.showChart;

  let initialTouchDist = 0;
  let initialVisibleCount = visibleCount;
  let startX = 0;

  let isInitialAnimation = true;
  let currentAnimProgress = 1;
  let priceAnimTriggered = false;
  let finalFormattedPrice = '';

  let chartAnimFrameId = null;
  let priceAnimFrameId = null;

  function loadSavedSettings() {
    try {
      const saved = localStorage.getItem('btc_neon_config');
      return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
    } catch (e) {
      return DEFAULT_SETTINGS;
    }
  }

  function saveCurrentSettings() {
    const config = {
      showChart: btnChart.classList.contains('active'),
      showPrice: btnPrice.classList.contains('active'),
      priceSize: parseInt(priceSizeInput.value, 10),
      animDuration: parseFloat(animDurationInput.value),
      neonColor: currentNeonHex
    };
    localStorage.setItem('btc_neon_config', JSON.stringify(config));
  }

  function applySavedSettingsUI() {
    const config = loadSavedSettings();
    
    showChart = config.showChart;
    currentNeonHex = config.neonColor;

    btnChart.classList.toggle('active', config.showChart);
    btnPrice.classList.toggle('active', config.showPrice);
    
    priceSizeInput.value = config.priceSize;
    animDurationInput.value = config.animDuration;
    customColorInput.value = config.neonColor;
    priceEl.style.display = config.showPrice ? 'inline-block' : 'none';

    updatePresetActiveState(config.neonColor);
    applyTheme(config.neonColor, false);
  }

  function updatePresetActiveState(colorHex) {
    let matched = false;
    presetDots.forEach(dot => {
      const isMatch = dot.dataset.color.toLowerCase() === colorHex.toLowerCase();
      dot.classList.toggle('active', isMatch);
      if (isMatch) matched = true;
    });
    paletteBtn.classList.toggle('active', !matched);
  }

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function animateHackerPrice(targetText) {
    if (priceAnimFrameId) cancelAnimationFrame(priceAnimFrameId);

    const chars = '0123456789$#%&*!?@';
    const duration = (parseFloat(animDurationInput.value) || 2.6) * 1000; 
    const startTime = performance.now();

    priceEl.classList.remove('show-price');
    void priceEl.offsetWidth; 
    priceEl.classList.add('show-price');

    function scramble(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      const lockedLength = Math.floor(progress * targetText.length);

      let currentStr = '';
      for (let i = 0; i < targetText.length; i++) {
        if (i < lockedLength || progress === 1) {
          currentStr += targetText[i];
        } else {
          currentStr += chars[Math.floor(Math.random() * chars.length)];
        }
      }

      priceEl.textContent = currentStr;
      fitPriceText();

      if (progress < 1) {
        priceAnimFrameId = requestAnimationFrame(scramble);
      } else {
        priceEl.textContent = targetText;
        fitPriceText();
        priceAnimFrameId = null;
      }
    }
    priceAnimFrameId = requestAnimationFrame(scramble);
  }

  function startIntroAnimation() {
    if (chartAnimFrameId) cancelAnimationFrame(chartAnimFrameId);

    const duration = (parseFloat(animDurationInput.value) || 2.6) * 1000;
    const startTime = performance.now();

    function animate(now) {
      const elapsed = now - startTime;
      const linearProgress = Math.min(elapsed / duration, 1);
      
      currentAnimProgress = easeInOutCubic(linearProgress);
      draw(currentAnimProgress);

      if (linearProgress < 1) {
        chartAnimFrameId = requestAnimationFrame(animate);
      } else {
        isInitialAnimation = false;
        currentAnimProgress = 1;
        draw(1);
        chartAnimFrameId = null;
      }
    }
    chartAnimFrameId = requestAnimationFrame(animate);
  }

  function triggerFullReloadAnimation() {
    if (!finalFormattedPrice) return;
    animateHackerPrice(finalFormattedPrice);
    startIntroAnimation();
  }

  function fitPriceText() {
    if (!priceEl) return;
    const sliderVal = parseFloat(priceSizeInput.value) || 60;
    const charCount = Math.max(priceEl.textContent.length, 1);
    
    const maxFittingVw = 100 / (charCount * 0.58); 
    const targetVw = (sliderVal / 100) * maxFittingVw;
    
    priceEl.style.fontSize = `clamp(10px, ${targetVw}vw, 95vw)`;

    const maxAllowedWidth = window.innerWidth * 0.92;
    if (priceEl.offsetWidth > maxAllowedWidth && priceEl.offsetWidth > 0) {
      const currentPx = parseFloat(window.getComputedStyle(priceEl).fontSize);
      const scaledPx = Math.max(10, currentPx * (maxAllowedWidth / priceEl.offsetWidth));
      priceEl.style.fontSize = `${scaledPx}px`;
    }
  }

  window.addEventListener('mousemove', (e) => {
    const rect = settingsToggle.getBoundingClientRect();
    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;
    const distance = Math.hypot(e.clientX - btnX, e.clientY - btnY);

    if (distance < 220 || settingsPanel.classList.contains('active')) {
      settingsToggle.classList.add('near');
    } else {
      settingsToggle.classList.remove('near');
    }
  });

  window.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    if (touch.clientX > window.innerWidth - 120 && touch.clientY < 120) {
      settingsToggle.classList.add('near');
    }
  });

  function hexToRgb(hex) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function applyTheme(hex, shouldSave = true) {
    currentNeonHex = hex;
    const rgb = hexToRgb(hex);
    document.documentElement.style.setProperty('--neon', hex);
    document.documentElement.style.setProperty('--neon-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
    customColorInput.value = hex;
    draw(currentAnimProgress);
    if (shouldSave) saveCurrentSettings();
  }

  settingsToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isActive = settingsPanel.classList.toggle('active');
    settingsToggle.classList.toggle('active-panel', isActive);
  });

  document.addEventListener('click', (e) => {
    if (!settingsPanel.contains(e.target) && !settingsToggle.contains(e.target)) {
      settingsPanel.classList.remove('active');
      settingsToggle.classList.remove('active-panel');
    }
  });

  btnChart.addEventListener('click', () => {
    const isActive = btnChart.classList.toggle('active');
    showChart = isActive;
    draw(currentAnimProgress);
    saveCurrentSettings();
  });

  btnPrice.addEventListener('click', () => {
    const isActive = btnPrice.classList.toggle('active');
    priceEl.style.display = isActive ? 'inline-block' : 'none';
    if (isActive) fitPriceText();
    saveCurrentSettings();
  });

  priceSizeInput.addEventListener('input', () => {
    fitPriceText();
    saveCurrentSettings();
  });

  animDurationInput.addEventListener('input', () => {
    saveCurrentSettings();
    triggerFullReloadAnimation();
  });

  presetDots.forEach(dot => {
    dot.addEventListener('click', () => {
      updatePresetActiveState(dot.dataset.color);
      applyTheme(dot.dataset.color);
    });
  });

  customColorInput.addEventListener('input', (e) => {
    updatePresetActiveState(e.target.value);
    applyTheme(e.target.value);
  });

  function resizeCanvas() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    draw(currentAnimProgress);
    fitPriceText();
  }
  window.addEventListener('resize', resizeCanvas);

  function formatPrice(p) {
    return '$' + Math.round(p).toLocaleString('en-US');
  }

  async function fetchData() {
    try {
      const r1 = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000');
      if (!r1.ok) throw new Error('Err1');
      const d1 = await r1.json();
      const t1 = d1[0][0];

      const r2 = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${t1 - 1}`);
      let d2 = [];
      if (r2.ok) d2 = await r2.json();

      let d3 = [];
      if (d2.length > 0) {
        const t2 = d2[0][0];
        const r3 = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000&endTime=${t2 - 1}`);
        if (r3.ok) d3 = await r3.json();
      }

      const combined = [...d3, ...d2, ...d1];
      allPoints = combined.map(k => parseFloat(k[4])).filter(p => !isNaN(p) && p > 0);

      updateView();
    } catch (e) {
      console.error('Errore dati Binance:', e);
      setTimeout(fetchData, 5000);
    }
  }

  canvas.addEventListener('dblclick', () => {
    visibleCount = 180;
    updateView();
  });

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (allPoints.length === 0) return;

    const zoomFactor = 1.12;
    if (e.deltaY > 0) {
      visibleCount = Math.min(allPoints.length, Math.ceil(visibleCount * zoomFactor));
    } else {
      visibleCount = Math.max(10, Math.floor(visibleCount / zoomFactor));
    }
    updateView();
  }, { passive: false });

  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
    } else if (e.touches.length === 2) {
      initialTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialVisibleCount = visibleCount;
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && allPoints.length > 0) {
      const deltaX = e.touches[0].clientX - startX;
      if (Math.abs(deltaX) > 15) {
        visibleCount = Math.max(10, Math.min(allPoints.length, visibleCount + (deltaX > 0 ? 3 : -3)));
        startX = e.touches[0].clientX;
        updateView();
      }
    } else if (e.touches.length === 2 && initialTouchDist > 0) {
      e.preventDefault();
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const zoomRatio = initialTouchDist / currentDist;
      visibleCount = Math.max(10, Math.min(allPoints.length, Math.round(initialVisibleCount * zoomRatio)));
      updateView();
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      initialTouchDist = 0;
    }
  });

  function updateView() {
    if (!allPoints || allPoints.length === 0) return;
    const visible = allPoints.slice(-visibleCount);
    finalFormattedPrice = formatPrice(visible[visible.length - 1]);

    if (isInitialAnimation) {
      if (!priceAnimTriggered) {
        priceAnimTriggered = true;
        animateHackerPrice(finalFormattedPrice);
      }
      startIntroAnimation();
    } else {
      priceEl.textContent = finalFormattedPrice;
      fitPriceText();
      draw(1);
    }
  }

  function draw(progress = 1) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    if (!showChart || !allPoints || allPoints.length === 0) return;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, w * progress, h);
    ctx.clip();

    const visible = allPoints.slice(-visibleCount);
    const paddingY = h * 0.16;

    const min = Math.min(...visible);
    const max = Math.max(...visible);
    const range = (max - min) || 1;
    const stepX = w / (visible.length - 1);

    const coordPoints = visible.map((p, i) => {
      const x = i * stepX;
      const y = h - paddingY - ((p - min) / range) * (h - paddingY * 2);
      return [x, y];
    });

    if (coordPoints.length < 2) {
      ctx.restore();
      return;
    }

    const rgb = hexToRgb(currentNeonHex);

    const gradFill = ctx.createLinearGradient(0, 0, 0, h);
    gradFill.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.35)`);
    gradFill.addColorStop(0.7, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.05)`);
    gradFill.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);

    ctx.beginPath();
    ctx.moveTo(coordPoints[0][0], coordPoints[0][1]);
    for (let i = 1; i < coordPoints.length; i++) {
      const [x, y] = coordPoints[i];
      const [px, py] = coordPoints[i - 1];
      const midX = (px + x) / 2;
      ctx.bezierCurveTo(midX, py, midX, y, x, y);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = gradFill;
    ctx.fill();

    const glowPasses = [
      { blur: 30, alpha: 0.35, width: 8 },
      { blur: 15, alpha: 0.55, width: 4 },
      { blur: 0,  alpha: 1,    width: 2.2 }
    ];

    glowPasses.forEach(pass => {
      ctx.save();
      ctx.shadowColor = currentNeonHex;
      ctx.shadowBlur = pass.blur;
      ctx.globalAlpha = pass.alpha;
      ctx.strokeStyle = pass.blur === 0 ? '#ffffff' : currentNeonHex;
      ctx.lineWidth = pass.width;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(coordPoints[0][0], coordPoints[0][1]);
      for (let i = 1; i < coordPoints.length; i++) {
        const [x, y] = coordPoints[i];
        const [px, py] = coordPoints[i - 1];
        const midX = (px + x) / 2;
        ctx.bezierCurveTo(midX, py, midX, y, x, y);
      }
      ctx.stroke();
      ctx.restore();
    });

    const last = coordPoints[coordPoints.length - 1];
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(last[0], last[1], 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  applySavedSettingsUI();
  resizeCanvas();
  fetchData();
  setInterval(fetchData, 60000);
</script>
