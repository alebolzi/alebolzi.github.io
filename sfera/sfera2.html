<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHRONOSPACE ARCHITECTURE :: INTERIOR</title>
    <style>
        :root {
            --void-core: #050507;
            --void-deep: #08080D;
            --void-edge: #0E0E16;
            --radiance-low: #1A2A3A;
            --radiance-mid: #00FFFF;
            --radiance-high: #FFFFFF;
            --meta-warning: #FF003C;
            --meta-glow: #9D00FF;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: auto;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--void-core);
            color: var(--radiance-high);
            font-family: 'JetBrains Mono', monospace;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!reduceMotion) {
            const state = {
                mouse3D: new THREE.Vector3(0, 0, 0),
                sphereAnchorZ: 0,
                cameraTargetLocalZ: 10,
                cameraLocalZ: 10,
                isMobile: window.innerWidth < 768,
                scrollMomentum: 0,
                cameraVelocityLocalZ: 0,
            };

            const StrataData = [
                { colorTarget: new THREE.Color(0x050507), morphFactor: 0.2 },
                { colorTarget: new THREE.Color(0x08080D), morphFactor: 0.4 },
                { colorTarget: new THREE.Color(0x0E0E16), morphFactor: 0.6 },
                { colorTarget: new THREE.Color(0x100505), morphFactor: 1.0 }
            ];

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050507, 0.015);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('app').appendChild(renderer.domElement);

            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.set(0, 0, 10);

            const glslNoise = `
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute( permute( permute(
                             i.z + vec4(0.0, i1.z, i2.z, 1.0))
                           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4( x.xy, y.xy ); vec4 b1 = vec4( x.zw, y.zw );
                    vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                    vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
                    return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
                }
            `;

            // 1. VOLUMETRIC VOID
            const voidMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }, uColorFog: { value: new THREE.Color(0x050507) },
                    uMouse3D: { value: new THREE.Vector3() }
                },
                vertexShader: `varying vec3 vWorldPos; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform float uTime; uniform vec3 uColorFog; uniform vec3 uMouse3D; varying vec3 vWorldPos; ${glslNoise}
                    void main() {
                        vec3 p = vWorldPos * 0.05; p.y -= uTime * 0.02; p.x += uMouse3D.x * 0.1; p.y += uMouse3D.y * 0.1;
                        float density = snoise(p) * 0.5 + 0.5; density = pow(density, 3.0);
                        vec3 col = mix(uColorFog, vec3(0.0, 0.05, 0.1), density * 0.5);
                        col += vec3(0.02, 0.0, 0.05) * (1.0 - min(length(vWorldPos) * 0.1, 1.0));
                        gl_FragColor = vec4(col, 1.0);
                    }`,
                side: THREE.BackSide, depthWrite: false
            });
            const voidMesh = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 32), voidMaterial);
            voidMesh.frustumCulled = false; scene.add(voidMesh);

            // 2. THE MONOLITH (Outer Shell - Sparisce quando si entra)
            const monolithMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }, uMouse3D: { value: new THREE.Vector3() },
                    uMorphFactor: { value: 0.2 }, uCameraZ: { value: 0 }, uInside: { value: 0.0 }
                },
                vertexShader: `uniform float uTime; uniform vec3 uMouse3D; uniform float uMorphFactor; varying vec3 vNormal; varying vec3 vWorldPos; varying float vDistort; ${glslNoise}
                    void main() {
                        vec3 pos = position;
                        vec3 mouseInfluence = uMouse3D - (modelMatrix * vec4(pos, 1.0)).xyz;
                        float dist = length(mouseInfluence);
                        float mouseForce = smoothstep(3.0, 0.0, dist) * 1.5; 
                        float noiseTime = uTime * 0.2;
                        float n1 = snoise(pos * 1.5 + vec3(noiseTime)) * 0.3 * uMorphFactor;
                        float n2 = snoise(pos * 4.0 + vec3(noiseTime * 2.0)) * 0.15 * uMorphFactor;
                        float distort = n1 + n2 + mouseForce * 0.4;
                        pos += normal * distort;
                        vec4 wp = modelMatrix * vec4(pos, 1.0);
                        vWorldPos = wp.xyz; vNormal = normalize(normalMatrix * normal); vDistort = distort;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }`,
                fragmentShader: `uniform float uTime; uniform float uCameraZ; uniform float uInside; varying vec3 vNormal; varying vec3 vWorldPos; varying float vDistort;
                    void main() {
                        vec3 viewDir = normalize(cameraPosition - vWorldPos);
                        float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 3.0);
                        vec3 baseColor = mix(vec3(0.02, 0.02, 0.05), vec3(0.0, 0.2, 0.3), fresnel);
                        vec3 glowColor = vec3(0.0, 0.8, 0.8);
                        float energy = abs(vDistort) * 5.0;
                        vec3 finalColor = mix(baseColor, glowColor, energy) * 0.7; // Ridotta luminosità
                        
                        // Alpha: 0.4 da fuori per vedere dentro, 0.0 da dentro per sparire
                        float alpha = mix(0.4, 0.0, uInside); 
                        gl_FragColor = vec4(finalColor, alpha);
                    }`,
                transparent: true, side: THREE.DoubleSide, depthWrite: false
            });
            const monolith = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 40), monolithMaterial);
            scene.add(monolith);

            // 3. INNER CORE CLUSTER (I triangolini - Molto visibili anche da fuori)
            const coreGroup = new THREE.Group();
            scene.add(coreGroup);

            const core1Mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending });
            const core1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), core1Mat);
            coreGroup.add(core1);

            const core2Mat = new THREE.MeshBasicMaterial({ color: 0x9D00FF, wireframe: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const core2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 0), core2Mat);
            core2.rotation.x = Math.PI / 3;
            coreGroup.add(core2);

            const core3Mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, wireframe: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
            const core3 = new THREE.Mesh(new THREE.IcosahedronGeometry(2.0, 0), core3Mat);
            coreGroup.add(core3);
            
            const core4Mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending });
            const core4 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 2), core4Mat); // Più dettagliato
            coreGroup.add(core4);

            // 4. PARTICLE SYSTEM (Attract & Disappear)
            const particleCount = state.isMobile ? 5000 : 50000;
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const bounds = { x: 30, y: 30, z: 40 };

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * bounds.x * 2;
                positions[i * 3 + 1] = (Math.random() - 0.5) * bounds.y * 2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * bounds.z * 2;
                velocities[i * 3] = (Math.random() - 0.5) * 0.01;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.01;
            }

            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.05, color: 0x00ffff, transparent: true, opacity: 0.6,
                blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            particles.frustumCulled = false;
            scene.add(particles);

            // 5. POST-PROCESSING
            const composer = new EffectComposer(renderer);
            composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            composer.setSize(window.innerWidth, window.innerHeight);

            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.1));

            const CustomShaderPass = {
                uniforms: {
                    tDiffuse: { value: null }, uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uResolution; varying vec2 vUv;
                    float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
                    void main() {
                        vec2 uv = vUv; vec2 dir = uv - 0.5; float dist = length(dir);
                        float offset = 0.003 * dist;
                        vec4 r = texture2D(tDiffuse, uv + dir * offset);
                        vec4 g = texture2D(tDiffuse, uv);
                        vec4 b = texture2D(tDiffuse, uv - dir * offset);
                        vec4 color = vec4(r.r, g.g, b.b, 1.0);
                        float vig = smoothstep(0.9, 0.2, dist);
                        color.rgb *= vig;
                        float n = random(uv + uTime) * 0.04;
                        color.rgb += n - 0.02;
                        gl_FragColor = color;
                    }
                `
            };
            const customPass = new ShaderPass(CustomShaderPass);
            composer.addPass(customPass);
            composer.addPass(new OutputPass());

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const intersectPoint = new THREE.Vector3();

            function updateMouse3D() {
                raycaster.setFromCamera(mouse, camera);
                const planeZ = state.sphereAnchorZ;
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -planeZ); 
                raycaster.ray.intersectPlane(plane, intersectPoint);
                state.mouse3D.copy(intersectPoint);
            }

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                updateMouse3D();
            });

            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                state.scrollMomentum += e.deltaY * 0.005;
            }, { passive: false });

            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: false });
            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                state.scrollMomentum += (touchStartY - e.touches[0].clientY) * 0.01 * (state.isMobile ? 1.5 : 1);
                touchStartY = e.touches[0].clientY;
                mouse.x = 0; mouse.y = 0;
                updateMouse3D();
            }, { passive: false });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                customPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });

            const clock = new THREE.Clock();
            let lerpColor = new THREE.Color(0x050507);
            let currentMorph = 0.2;

            function animate() {
                requestAnimationFrame(animate);
                const delta = Math.min(clock.getDelta(), 0.1);
                const elapsed = clock.getElapsedTime();

                // 1. Fisica della Navigazione
                state.cameraTargetLocalZ -= state.scrollMomentum;
                state.scrollMomentum *= 0.92;
                state.cameraTargetLocalZ -= 0.005; // Drift automatico

                // BLOCCO: Non fuoriuscire dall'altra parte. Si ferma a -0.5 (centro sfera)
                state.cameraTargetLocalZ = Math.max(-0.5, Math.min(20, state.cameraTargetLocalZ));
                
                // Spring Physics
                let cameraForce = (state.cameraTargetLocalZ - state.cameraLocalZ) * 0.08;
                state.cameraVelocityLocalZ += cameraForce;
                state.cameraVelocityLocalZ *= 0.82;
                state.cameraLocalZ += state.cameraVelocityLocalZ;

                // L'ancora si muove nel vuoto
                state.sphereAnchorZ -= 0.01;

                // Camera
                camera.position.z = state.sphereAnchorZ + state.cameraLocalZ;
                camera.position.x = 0;
                camera.position.y = 0;
                camera.lookAt(0, 0, state.sphereAnchorZ);

                // Calcolo del fattore "Dentro" (0 = fuori, 1 = dentro al centro)
                let outsideFactor = THREE.MathUtils.smoothstep(state.cameraLocalZ, 0.0, 2.5);
                let insideFactor = 1.0 - outsideFactor;

                // 2. Aggiorna Sfere
                monolith.position.z = state.sphereAnchorZ;
                coreGroup.position.z = state.sphereAnchorZ;

                monolith.rotation.y += delta * 0.1;
                monolith.rotation.x += delta * 0.05;

                core1.rotation.y -= delta * 0.8;
                core1.rotation.z += delta * 0.3;
                core2.rotation.x += delta * 1.2;
                core2.rotation.y -= delta * 0.5;
                core3.rotation.z -= delta * 0.4;
                core3.rotation.x += delta * 0.2;
                core4.rotation.y += delta * 1.5;
                core4.rotation.x -= delta * 1.1;

                updateMouse3D();

                // Shader Updates
                voidMaterial.uniforms.uTime.value = elapsed;
                voidMaterial.uniforms.uMouse3D.value.copy(state.mouse3D);
                lerpColor.lerp(StrataData[insideFactor > 0.5 ? 3 : 0].colorTarget, 0.05);
                voidMaterial.uniforms.uColorFog.value.copy(lerpColor);

                monolithMaterial.uniforms.uTime.value = elapsed;
                monolithMaterial.uniforms.uMouse3D.value.copy(state.mouse3D);
                monolithMaterial.uniforms.uCameraZ.value = camera.position.z;
                monolithMaterial.uniforms.uInside.value = THREE.MathUtils.damp(monolithMaterial.uniforms.uInside.value, insideFactor, 0.1, delta);
                
                currentMorph = THREE.MathUtils.damp(currentMorph, insideFactor > 0.5 ? 1.0 : 0.4, 0.05, delta);
                monolithMaterial.uniforms.uMorphFactor.value = currentMorph;

                // Interazione Core con il mouse
                let mDist = state.mouse3D.distanceTo(monolith.position);
                let coreScale = 1.0 + Math.max(0, 1.0 - mDist / 2.0) * 0.5;
                core1.scale.setScalar(THREE.MathUtils.damp(core1.scale.x, coreScale, 0.1, delta));
                core2.scale.setScalar(THREE.MathUtils.damp(core2.scale.x, coreScale * 0.8, 0.1, delta));
                core3.scale.setScalar(THREE.MathUtils.damp(core3.scale.x, coreScale * 1.2, 0.1, delta));
                core4.scale.setScalar(THREE.MathUtils.damp(core4.scale.x, coreScale * 0.4, 0.1, delta));

                // 3. Logica Particellare
                const positions = particleGeo.attributes.position.array;
                const targetZ = camera.position.z;
                
                for (let i = 0; i < particleCount; i++) {
                    let ix = i * 3;
                    let iy = i * 3 + 1;
                    let iz = i * 3 + 2;
                    
                    let relZ = positions[iz] - targetZ;
                    relZ = ((relZ % (bounds.z * 2)) + (bounds.z * 2)) % (bounds.z * 2);
                    if (relZ > bounds.z) relZ -= bounds.z * 2;
                    positions[iz] = targetZ + relZ;
                    
                    let dx = state.mouse3D.x - positions[ix];
                    let dy = state.mouse3D.y - positions[iy];
                    let dz = state.mouse3D.z - positions[iz];
                    let distSq = dx*dx + dy*dy + dz*dz;
                    
                    if (distSq < 1.0 && distSq > 0.01) {
                        positions[ix] = (Math.random() - 0.5) * bounds.x * 2;
                        positions[iy] = (Math.random() - 0.5) * bounds.y * 2;
                        positions[iz] = targetZ - 20 - Math.random() * 20;
                    } else if (distSq < 64.0) {
                        let dist = Math.sqrt(distSq);
                        let force = (1.0 - dist / 8.0) * 0.08;
                        positions[ix] += (dx/dist) * force;
                        positions[iy] += (dy/dist) * force;
                        positions[iz] += (dz/dist) * force;
                    } else {
                        positions[ix] += velocities[ix];
                        positions[iy] += velocities[iy];
                        positions[iz] += velocities[iz];
                    }
                }
                particleGeo.attributes.position.needsUpdate = true;

                // 4. Post-Processing
                customPass.uniforms.uTime.value = elapsed;

                composer.render();
            }

            animate();
        }
    </script>
</body>
</html>
