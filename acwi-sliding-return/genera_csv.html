<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACWI Data Downloader</title><style>body{margin:0;background:#0d0d10;color:#eee;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));background:#17171c;border:1px solid #292932;border-radius:18px;padding:24px;box-sizing:border-box}h1{font-size:22px;margin:0 0 8px}.sub{color:#999;margin-bottom:20px}button{width:100%;border:0;border-radius:12px;padding:13px;background:#9d7cff;color:white;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.status{margin-top:14px;color:#aaa;font-size:13px;min-height:18px}</style></head><body><div class="card"><h1>MSCI ACWI</h1><div class="sub">Dati mensili · 12/1987 → 05/2026</div><button id="download">Scarica data.csv</button><div class="status" id="status"></div></div><script>
const SOURCE='https://raw.githubusercontent.com/PulfordJ/synthetic-global-equity/master/data/msci_acwi_index_dec_1987_to_may_2026.csv';
const btn=document.getElementById('download'), status=document.getElementById('status');
btn.onclick=async()=>{btn.disabled=true;status.textContent='Scaricamento dati…';try{const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();const rows=text.trim().split(/\r?\n/).filter(Boolean);const out=['date,acwi'];for(let i=1;i<rows.length;i++){const p=rows[i].split(',');if(p.length>=2){const [m,y]=p[0].split('/');out.push(`${y}-${m.padStart(2,'0')},${p.slice(1).join(',')}`)}}const blob=new Blob([out.join('\n')+'\n'],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);status.textContent=`Fatto ✓ ${out.length-1} osservazioni`;}catch(e){status.textContent='Errore: '+e.message+' · Prova ad aprire il file tramite un server locale.';}finally{btn.disabled=false}};
</script></body></html>
